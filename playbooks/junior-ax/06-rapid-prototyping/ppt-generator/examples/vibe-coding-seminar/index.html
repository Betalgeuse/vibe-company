<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE CODING - 비개발자를 위한 AI 코딩 특강</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .slide {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 80px;
            position: relative;
        }

        .slide.active { display: flex; }

        /* Cover slides */
        .slide.cover {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            text-align: center;
        }
        .slide.cover .title {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #a78bfa, #818cf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .slide.cover .subtitle {
            font-size: 28px;
            font-weight: 300;
            color: #c4b5fd;
            margin-bottom: 40px;
        }
        .slide.cover .body {
            font-size: 22px;
            line-height: 1.8;
            color: #e2e8f0;
            max-width: 700px;
        }

        /* Content slides */
        .slide.content, .slide.data {
            background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 100%);
            align-items: flex-start;
            text-align: left;
        }
        .slide .part-title {
            font-size: 16px;
            font-weight: 500;
            color: #818cf8;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .slide .heading {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 36px;
            line-height: 1.3;
            color: #f1f5f9;
        }
        .slide .content-body {
            font-size: 22px;
            line-height: 2;
            color: #cbd5e1;
            max-width: 900px;
        }
        .slide .content-body strong {
            color: #a78bfa;
            font-weight: 700;
        }

        /* List items */
        .slide .content-body .item {
            padding: 6px 0;
            padding-left: 20px;
            position: relative;
        }
        .slide .content-body .item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 16px;
            width: 8px;
            height: 8px;
            background: #818cf8;
            border-radius: 50%;
        }

        /* Card style for data slides */
        .slide.data .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .slide.data .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        .slide.data .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #a78bfa;
            margin-bottom: 8px;
        }

        /* Step indicator */
        .step-badge {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        /* Numbered list */
        .numbered-list {
            counter-reset: step;
            list-style: none;
            padding: 0;
        }
        .numbered-list li {
            counter-increment: step;
            padding: 10px 0 10px 50px;
            position: relative;
            font-size: 22px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .numbered-list li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            top: 8px;
            width: 34px;
            height: 34px;
            background: rgba(99, 102, 241, 0.3);
            border: 2px solid #818cf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #a78bfa;
        }

        /* QnA style */
        .qa-block { margin-bottom: 24px; }
        .qa-block .q {
            font-size: 20px;
            font-weight: 700;
            color: #a78bfa;
            margin-bottom: 4px;
        }
        .qa-block .a {
            font-size: 20px;
            color: #cbd5e1;
            padding-left: 24px;
        }

        /* Highlight box */
        .highlight-box {
            background: rgba(99, 102, 241, 0.15);
            border-left: 4px solid #818cf8;
            padding: 20px 24px;
            border-radius: 0 12px 12px 0;
            margin: 16px 0;
            font-size: 20px;
            color: #e2e8f0;
            line-height: 1.7;
        }

        /* Contact */
        .contact-info {
            font-size: 24px;
            color: #cbd5e1;
            line-height: 2;
            margin-top: 20px;
        }
        .contact-info a {
            color: #a78bfa;
            text-decoration: none;
        }

        /* Indicator */
        .indicator {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            color: #94a3b8;
            font-size: 14px;
            z-index: 100;
            transition: opacity 0.3s;
        }
        .indicator.hidden { opacity: 0; }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #a78bfa);
            transition: width 0.3s ease;
            z-index: 200;
        }
    </style>
</head>

    let currentSlide = 0;
    const totalSlides = slidesData.length;

    function init() {
        const container = document.getElementById('slideContainer');
        document.getElementById('total').textContent = totalSlides;

        slidesData.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = `slide ${s.type}` + (i === 0 ? ' active' : '');
            div.innerHTML = s.html;
            container.appendChild(div);
        });
        updateProgress();
    }

    function showSlide(index) {
        if (index < 0 || index >= totalSlides) return;
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.slide')[index].classList.add('active');
        currentSlide = index;
        document.getElementById('current').textContent = currentSlide + 1;
        updateProgress();
    }

    function updateProgress() {
        const pct = ((currentSlide + 1) / totalSlides) * 100;
        document.getElementById('progressBar').style.width = pct + '%';
    }

    document.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowRight': case ' ':
                e.preventDefault(); showSlide(currentSlide + 1); break;
            case 'ArrowLeft':
                showSlide(currentSlide - 1); break;
            case 'Home': case 'ArrowUp':
                showSlide(0); break;
            case 'End': case 'ArrowDown':
                showSlide(totalSlides - 1); break;
            case 'Escape':
                if (document.fullscreenElement) document.exitFullscreen();
                else document.documentElement.requestFullscreen();
                break;
        }
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
    document.addEventListener('touchend', e => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (diff < -50) showSlide(currentSlide + 1);
        if (diff > 50) showSlide(currentSlide - 1);
    });

    init();
    </script>
